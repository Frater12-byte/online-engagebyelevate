# Reference only — CloudPanel manages the live vhost. Do not deploy.
# /etc/nginx/sites-available/online.engagebyelevate.com
# Static site for online.engagebyelevate.com — no proxy, no Node app

server {
    listen 80;
    listen [::]:80;
    server_name online.engagebyelevate.com;

    root /home/engagebyelevate/htdocs/online.engagebyelevate.com;
    index index.html;

    location = /programme {
        try_files /programme.html =404;
    }

    location = /data/meetings.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;

    access_log /var/log/nginx/online.engagebyelevate.access.log;
    error_log  /var/log/nginx/online.engagebyelevate.error.log;
}
